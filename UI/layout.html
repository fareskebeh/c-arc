<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        }

        html, body {
        height: 100%;
        background-color: #171717;
        color: white;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        }

        header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #1f1f1f;
        padding: 8px 12px;
        }

        header img {
        width: 24px;
        height: 24px;
        }

        .window-controls {
        display: flex;
        gap: 8px;
        }

        .window-controls button {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        transition: filter 0.15s;
        }

        .window-controls button:hover {
        filter: brightness(1.3);
        }

        #minimize {
            background-color: #22c55e; 
        }

        #maximize {
            background-color: #fbbf24; 
        }

        #close { background-color: #ef4444; }

        main {
        flex: 1;
        display: flex;
        border-top: 1px solid #2e2e2e;
        }

        #explorer {
        flex: 0.15;
        border-right: 1px solid #2e2e2e;
        padding: 12px;
        overflow-y: auto;
        }

        #editor {
        flex: 0.85;
        padding: 12px;
        border-left: 1px solid #2e2e2e;
        overflow: auto;
        }
   </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

    <body>

        <main>
            <aside id="explorer">EXPLORER</aside>
            <section id="editor">EDITOR</section>
        </main>

        <script>
                
        </script>
    </body>
</html>
